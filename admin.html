<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FinanceOS Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#04110d;--bg2:#071a14;--card:#0b241d;--card2:#0e2c23;--line:#164236;--tx:#e9fff5;--mu:#8db5a5;--em:#10b981;--em2:#34d399;--ink:#022c1f;--warn:#fbbf24;--bad:#f87171;--info:#38bdf8;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2fbf7;--bg2:#e7f7f0;--card:#fff;--card2:#f4fbf8;--line:#bfe3d3;--tx:#06291e;--mu:#43695a;--ink:#fff;--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2fbf7;--bg2:#e7f7f0;--card:#fff;--card2:#f4fbf8;--line:#bfe3d3;--tx:#06291e;--mu:#43695a;--ink:#fff;--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--em2)}
.hide{display:none!important}
/* sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(800px 400px at 50% -10%,rgba(16,185,129,.22),transparent 70%),var(--bg)}
.gate .box{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.25rem "Bricolage Grotesque",sans-serif}.logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--em2),var(--em));color:var(--ink);font-style:normal}
.logo b{color:var(--em2)}
.fld{display:grid;gap:6px;margin-top:14px}.fld label{font-size:.85rem;color:var(--mu);font-weight:500}
.in{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);outline:none}.in:focus{border-color:var(--em2);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid transparent;background:var(--em);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.o{background:transparent;border-color:var(--line);color:var(--tx)}.btn.o:hover{border-color:var(--em2)}
.btn.bad{background:transparent;border-color:rgba(248,113,113,.55);color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:.85rem;border-radius:9px}
.err{color:var(--bad);font-size:.88rem;margin-top:10px;min-height:1.2em}
/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:18px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--mu);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--card);color:var(--tx)}.nav button.on{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 0 var(--em2)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .ct{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--warn);color:#1a1200;font:700 .75rem/22px "DM Sans";text-align:center}
.side .me{margin-top:auto;font-size:.82rem;color:var(--mu);display:grid;gap:8px;word-break:break-all}
main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:1.6rem}.top p{color:var(--mu);font-size:.9rem}
.top .acts{display:flex;gap:8px;align-items:center}
.stamp{font-size:.8rem;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--em2)}
.kpi small{color:var(--mu);font-size:.82rem}.kpi b{display:block;font:800 1.9rem/1.15 "Bricolage Grotesque",sans-serif;margin-top:4px}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--em2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font-size:1.1rem;margin-bottom:4px}.card .sub{color:var(--mu);font-size:.86rem;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.88rem}
.seg button.on{background:var(--em);color:var(--ink)}
.bar .in{width:auto;flex:1;min-width:180px;padding:8px 12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--mu);font-weight:500;font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mu);font-size:.8rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem;letter-spacing:.02em}
.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto;margin:0 -4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.p-wait{background:rgba(251,191,36,.16);color:var(--warn)}.p-ok{background:rgba(52,211,153,.18);color:var(--em2)}.p-bad{background:rgba(248,113,113,.16);color:var(--bad)}.p-mu{background:rgba(141,181,165,.16);color:var(--mu)}.p-info{background:rgba(56,189,248,.16);color:var(--info)}
.acts-c{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:26px 10px;text-align:center;color:var(--mu)}
.cp{border:0;background:none;color:var(--mu);cursor:pointer;padding:0 0 0 4px;vertical-align:middle}.cp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.li span{min-width:0}.li small{display:block;color:var(--mu);font-size:.8rem}
/* dialogs */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.dlg h3{font-size:1.2rem;margin-bottom:6px}.dlg .sub{color:var(--mu);font-size:.88rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:.9rem}.dl dt{color:var(--mu)}.dl dd{margin:0;font-weight:500;word-break:break-all}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.9rem}.chk input{margin-top:3px;accent-color:var(--em)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:5px 10px;cursor:pointer;font-size:.8rem;color:var(--tx)}.chips button:hover{border-color:var(--em2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--em2);padding:11px 16px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.toast.bad{border-color:var(--bad)}
.note{font-size:.84rem;color:var(--mu);margin-top:10px}
.mtop{display:none}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side>*{min-width:0}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}
 .side .logo{font-size:1.05rem}.side .logo span{display:none}
 .nav{display:flex;overflow-x:auto;gap:4px;flex:1;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
 .nav button{width:auto;white-space:nowrap;padding:8px 10px}.nav button span{display:inline}.nav button.on{box-shadow:inset 0 -2px 0 var(--em2)}
 .side .me{display:none}.mtop{display:flex}
 table.rsp,table.rsp tbody{display:block;width:100%}
 table.rsp thead{display:none}
 .bar .in{flex:1 1 100%;min-width:0}
 .tw{margin:0;overflow:visible}
 table.rsp td>span,table.rsp td>b{min-width:0;overflow-wrap:anywhere}
 table.rsp tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
 table.rsp td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 2px;text-align:right}
 table.rsp td::before{content:attr(data-l);color:var(--mu);font-size:.8rem;text-align:left;flex:none}
 table.rsp td.num{text-align:right}
 table.rsp td .acts-c{justify-content:flex-end}
 table.rsp td small{text-align:right}
}
</style>
</head>
<body>
<!-- ═══ Sign in ═══ -->
<section class="gate" id="gate">
 <div class="box">
  <div class="logo"><i>F</i><span>Finance<b>OS</b></span></div>
  <h1 style="font-size:1.4rem;margin-top:18px">Command Center</h1>
  <p style="color:var(--mu);font-size:.9rem;margin-top:4px">Sign in with your admin FinanceOS account.</p>
  <form id="loginF" autocomplete="on">
   <div class="fld"><label for="le">Email</label><input class="in" id="le" type="email" autocomplete="username" required></div>
   <div class="fld"><label for="lp">Password</label><input class="in" id="lp" type="password" autocomplete="current-password" required></div>
   <button class="btn" style="width:100%;margin-top:18px" id="lb">Sign in</button>
   <p class="err" id="lerr" role="alert"></p>
  </form>
 </div>
</section>

<!-- ═══ App ═══ -->
<div class="app hide" id="app">
 <aside class="side">
  <div class="logo"><i>F</i><span>Finance<b>OS</b></span></div>
  <nav class="nav" id="nav"></nav>
  <div class="me"><span id="meE"></span><button class="btn o sm" id="out">Sign out</button></div>
  <button class="btn o sm mtop" id="out2" aria-label="Sign out">Sign out</button>
 </aside>
 <main>
  <div class="top"><div><h1 id="pgT"></h1><p id="pgS"></p></div><div class="acts"><span class="stamp" id="stamp"></span><button class="btn o sm" id="rf">Refresh</button></div></div>
  <div id="view"></div>
 </main>
</div>

<script>
/* ══ Settings: same Supabase project as the FinanceOS app ══ */
const SUPABASE_URL='https://fvkzhydshoklketmfqzz.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Vh1YqfNaC8VTZOmXVsZQ1g_nUwSMHYO';   /* public key, safe to ship: Row Level Security protects the data */
const TZ='Asia/Kolkata';

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const dt=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric',timeZone:TZ}):'–';
const dtt=t=>t?new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit',timeZone:TZ}):'–';
const DAY=864e5,daysTo=t=>Math.ceil((new Date(t)-Date.now())/DAY);
const ago=t=>{if(!t)return 'never';const m=Math.round((Date.now()-new Date(t))/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
const ICO={home:'<path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',pay:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v0M14 21h7M18 18v3"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0113 0M16 4.5a3.5 3.5 0 010 7M18 14a6 6 0 013.5 6"/>',bell:'<path d="M18 8a6 6 0 10-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M13.7 20a2 2 0 01-3.4 0"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/>',log:'<path d="M4 6h16M4 12h16M4 18h10"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 00-1-1H5a1 1 0 00-1 1v10a1 1 0 001 1h3"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[k]}</svg>`;

let sb=null;
try{sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'fos-admin-auth'}})}catch(e){}

const S={tab:'home',users:[],pays:[],audit:[],plans:[],settings:{},me:null,payF:'pending',userF:'all',q:'',loading:false};
const PLAN=id=>(S.plans.find(p=>p.id===id)||{name:id||'–'}).name;
const PAYST={pending_verification:['p-wait','Pending'],verified:['p-ok','Confirmed'],rejected:['p-bad','Rejected']};
const userState=u=>u.locked?['p-bad','Locked']:u.pending_payment&&!u.active?['p-wait','Payment pending']:!u.plan_id?['p-mu','No plan']:!u.active?['p-bad','Expired']:u.source==='free'?['p-info','Free']:daysTo(u.expires_at)<=10?['p-wait','Ending soon']:['p-ok','Active'];

function toast(m,bad){const t=document.createElement('div');t.className='toast'+(bad?' bad':'');t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3800)}
const friendly=e=>{const m=(e&&(e.message||e.error_description||e.msg))||String(e||'Something went wrong');return m.replace(/^.*?ERROR:\s*/,'')};

/* ── sign in ── */
$('#loginF').onsubmit=async e=>{e.preventDefault();const b=$('#lb');$('#lerr').textContent='';if(!sb){$('#lerr').textContent='Could not reach Supabase. Check your connection and reload.';return}
 b.disabled=true;b.textContent='Signing in…';
 const {error}=await sb.auth.signInWithPassword({email:$('#le').value.trim(),password:$('#lp').value});
 b.disabled=false;b.textContent='Sign in';if(error){$('#lerr').textContent='Email or password is not right.';return}
 boot()};
const signOut=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};
$('#out').onclick=signOut;$('#out2').onclick=signOut;

async function boot(){
 if(!sb){$('#lerr').textContent='Could not reach Supabase. Check your connection and reload.';return}
 const {data}=await sb.auth.getSession();const ses=data&&data.session;if(!ses)return;
 const {data:isA,error}=await sb.rpc('billing_is_admin');
 if(error||!isA){await sb.auth.signOut();$('#lerr').textContent=error?'Could not check admin access: '+friendly(error):'This account is not an admin. Ask for access, or sign in with your admin account.';return}
 S.me=ses.user;$('#meE').textContent=ses.user.email;$('#gate').classList.add('hide');$('#app').classList.remove('hide');
 const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))S.tab=h;
 await load();setInterval(()=>{if(!document.hidden&&!$('.ov'))load(true)},60000)}

/* ── data ── */
async function load(quiet){if(S.loading)return;S.loading=true;if(!quiet)$('#rf').textContent='Loading…';
 try{
  const [u,p,a,pl,st]=await Promise.all([
   sb.rpc('billing_admin_users'),
   sb.from('billing_payments').select('*').not('utr','is',null).order('submitted_at',{ascending:false}).limit(1000),
   sb.from('billing_audit').select('*').order('at',{ascending:false}).limit(300),
   sb.from('billing_plans').select('*').order('rank'),
   sb.from('billing_settings').select('*')]);
  const bad=[u,p,a,pl,st].find(r=>r.error);if(bad)throw bad.error;
  S.users=u.data||[];S.pays=p.data||[];S.audit=a.data||[];S.plans=pl.data||[];S.settings=Object.fromEntries((st.data||[]).map(r=>[r.key,r.value]));
  $('#stamp').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',timeZone:TZ});
 }catch(e){toast('Could not load: '+friendly(e),true)}
 S.loading=false;$('#rf').textContent='Refresh';render()}
$('#rf').onclick=()=>load();

const uById=id=>S.users.find(u=>u.user_id===id)||{};
const pending=()=>S.pays.filter(p=>p.status==='pending_verification');
const expSoon=()=>S.users.filter(u=>u.active&&!u.locked&&daysTo(u.expires_at)<=10).sort((a,b)=>new Date(a.expires_at)-new Date(b.expires_at));

/* ── nav ── */
const TABS=[['home','Overview','home'],['payments','Payments','pay'],['users','Users','users'],['reminders','Reminders','bell'],['settings','Settings','gear'],['activity','Activity','log']];
function nav(){$('#nav').innerHTML=TABS.map(t=>{const c=t[0]==='payments'?pending().length:t[0]==='reminders'?expSoon().length:0;return `<button class="${S.tab===t[0]?'on':''}" data-tab="${t[0]}">${svg(t[2])}<span>${t[1]}</span>${c?`<b class="ct">${c}</b>`:''}</button>`}).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)};
function go(t,f){if(S.tab!==t)S.q='';S.tab=t;if(f){if(t==='payments')S.payF=f;if(t==='users')S.userF=f}history.replaceState(null,'','#'+t);render();scrollTo(0,0)}

/* ── views ── */
function render(){nav();const V={home:vHome,payments:vPays,users:vUsers,reminders:vRem,settings:vSet,activity:vAct}[S.tab]||vHome;V()}
const head=(t,s)=>{$('#pgT').textContent=t;$('#pgS').textContent=s||''};

function vHome(){head('Overview','Everything that needs you, at a glance.');
 const us=S.users,act=us.filter(u=>u.active),now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),1);
 const month=S.pays.filter(p=>p.status==='verified'&&new Date(p.verified_at)>=ms).reduce((n,p)=>n+p.expected_amount,0);
 const k=(cls,lab,val,t,f)=>`<button class="kpi ${cls}" data-go="${t}" data-f="${f||''}"><small>${lab}</small><b>${val}</b></button>`;
 const pend=pending(),soon=expSoon();
 $('#view').innerHTML=`<div class="kpis">
  ${k(pend.length?'warn':'','Payments to confirm',pend.length,'payments','pending')}
  ${k('ok','Active plans',act.length,'users','active')}
  ${k('','All users',us.length,'users','all')}
  ${k(soon.length?'warn':'','Ending in 10 days',soon.length,'reminders')}
  ${k(us.filter(u=>u.plan_id&&!u.active).length?'bad':'','Expired or locked',us.filter(u=>u.plan_id&&!u.active).length,'users','expired')}
  ${k('ok','Confirmed this month',inr(month),'payments','verified')}</div>
  <div class="g2"><div class="card"><h2>Payments to confirm</h2><p class="sub">Check each one in your UPI app before confirming.</p>${pend.length?`<div class="list">${pend.slice(0,6).map(p=>{const u=uById(p.user_id);return `<div class="li"><span><b>${esc(p.customer_name||u.name||u.email)}</b><small>${esc(PLAN(p.plan_id))} · ${p.billing_interval==='year'?'yearly':'monthly'} · <span class="mono">${esc(p.utr)}</span> · ${ago(p.submitted_at)}</small></span><span style="display:flex;gap:6px;align-items:center"><b>${inr(p.expected_amount)}</b><button class="btn sm" data-rev="${esc(p.id)}">Review</button></span></div>`}).join('')}</div>`:'<p class="empty">Nothing waiting. All caught up.</p>'}</div>
  <div class="card"><h2>Plans ending soon</h2><p class="sub">Customers are reminded 3 days before. You see them 10 days before.</p>${soon.length?`<div class="list">${soon.slice(0,6).map(u=>`<div class="li"><span><b>${esc(u.name||u.email)}</b><small>${esc(u.email)} · ${esc(PLAN(u.plan_id))}</small></span><span class="pill ${daysTo(u.expires_at)<=3?'p-bad':'p-wait'}">${daysTo(u.expires_at)} d · ${dt(u.expires_at)}</span></div>`).join('')}</div>`:'<p class="empty">No plans end in the next 10 days.</p>'}</div></div>
  <div class="card"><h2>Recently active</h2><p class="sub">Last sign-ins to FinanceOS.</p><div class="list">${us.filter(u=>u.last_sign_in).sort((a,b)=>new Date(b.last_sign_in)-new Date(a.last_sign_in)).slice(0,6).map(u=>{const s=userState(u);return `<div class="li"><span><b>${esc(u.name||u.email)}</b><small>${esc(u.email)} · ${ago(u.last_sign_in)}</small></span><span class="pill ${s[0]}">${s[1]}</span></div>`}).join('')||'<p class="empty">No sign-ins yet.</p>'}</div></div>`}

function vPays(){head('Payments','Confirm a payment only after you see the exact amount and UTR in your UPI app.');
 const F=[['pending','Pending'],['verified','Confirmed'],['rejected','Rejected'],['all','All']],m={pending:'pending_verification',verified:'verified',rejected:'rejected'};
 const q=S.q.toLowerCase();
 const rows=S.pays.filter(p=>S.payF==='all'||p.status===m[S.payF]).filter(p=>{if(!q)return true;const u=uById(p.user_id);return [p.id,p.utr,p.customer_name,u.email,u.name].join(' ').toLowerCase().includes(q)});
 $('#view').innerHTML=`<div class="card"><div class="bar"><div class="seg">${F.map(f=>`<button class="${S.payF===f[0]?'on':''}" data-pf="${f[0]}">${f[1]}${f[0]==='pending'&&pending().length?' ('+pending().length+')':''}</button>`).join('')}</div><input class="in" id="q" placeholder="Search name, email, request ID or UTR" value="${esc(S.q)}"></div>
 ${rows.length?`<div class="tw"><table class="rsp"><thead><tr><th>Customer</th><th>Request</th><th>Plan</th><th class="num">Amount</th><th>UTR</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(p=>{const u=uById(p.user_id),s=PAYST[p.status];return `<tr>
  <td data-l="Customer"><span><b>${esc(p.customer_name||u.name||'–')}</b><small>${esc(u.email||'')}</small></span></td>
  <td data-l="Request"><span class="mono">${esc(p.id)}</span></td>
  <td data-l="Plan"><span>${esc(PLAN(p.plan_id))}<small>${p.billing_interval==='year'?'Yearly':'Monthly'}${p.is_renewal?' · renewal':''}${p.coupon_code?' · '+esc(p.coupon_code):''}</small></span></td>
  <td data-l="Amount" class="num"><b>${inr(p.expected_amount)}</b></td>
  <td data-l="UTR"><span class="mono">${esc(p.utr)}</span><button class="cp" data-copy="${esc(p.utr)}" aria-label="Copy UTR">${svg('copy')}</button></td>
  <td data-l="Submitted"><span>${dtt(p.submitted_at)}<small>${ago(p.submitted_at)}</small></span></td>
  <td data-l="Status"><span><span class="pill ${s[0]}">${s[1]}</span>${p.status==='rejected'?`<small>${esc(p.rejection_reason)}</small>`:p.status==='verified'?`<small>${dtt(p.verified_at)}</small>`:''}</span></td>
  <td data-l="">${p.status==='pending_verification'?`<div class="acts-c"><button class="btn sm" data-rev="${esc(p.id)}">Review</button></div>`:''}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No payments here.</p>'}</div>`;
 const qi=$('#q');qi.oninput=()=>{S.q=qi.value;const pos=qi.selectionStart;vPays();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}

function vUsers(){head('Users','Everyone with a FinanceOS login. Manage plans, free access and locks.');
 const F=[['all','All'],['active','Active'],['pending','Payment pending'],['soon','Ending soon'],['expired','Expired or locked'],['free','Free'],['none','No plan']];
 const fil={all:()=>true,active:u=>u.active,pending:u=>!!u.pending_payment,soon:u=>u.active&&daysTo(u.expires_at)<=10,expired:u=>u.plan_id&&!u.active,free:u=>u.source==='free'&&u.active,none:u=>!u.plan_id}[S.userF]||(()=>true);
 const q=S.q.toLowerCase(),rows=S.users.filter(fil).filter(u=>!q||[u.email,u.name].join(' ').toLowerCase().includes(q));
 $('#view').innerHTML=`<div class="card"><div class="bar"><div class="seg">${F.map(f=>`<button class="${S.userF===f[0]?'on':''}" data-uf="${f[0]}">${f[1]}</button>`).join('')}</div><input class="in" id="q" placeholder="Search name or email" value="${esc(S.q)}"></div>
 ${rows.length?`<div class="tw"><table class="rsp"><thead><tr><th>User</th><th>Status</th><th>Plan</th><th>Ends</th><th>Last sign-in</th><th class="num">Paid</th><th></th></tr></thead><tbody>${rows.map(u=>{const s=userState(u);return `<tr>
  <td data-l="User"><span><b>${esc(u.name||'–')}</b><small>${esc(u.email)} · joined ${dt(u.signed_up)}</small></span></td>
  <td data-l="Status"><span class="pill ${s[0]}">${s[1]}</span></td>
  <td data-l="Plan">${u.plan_id?esc(PLAN(u.plan_id))+(u.source==='free'?' <small>free</small>':''):'–'}</td>
  <td data-l="Ends">${u.expires_at?`<span>${dt(u.expires_at)}<small>${u.active?daysTo(u.expires_at)+' days left':'ended'}</small></span>`:'–'}</td>
  <td data-l="Last sign-in">${ago(u.last_sign_in)}</td>
  <td data-l="Paid" class="num">${inr(u.paid_total)}<small>${u.payments} payment${u.payments===1?'':'s'}</small></td>
  <td data-l=""><div class="acts-c">${u.pending_payment?`<button class="btn sm" data-rev="${esc(u.pending_payment)}">Review payment</button>`:''}<button class="btn o sm" data-mng="${esc(u.user_id)}">Manage</button></div></td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No users match.</p>'}</div>`;
 const qi=$('#q');qi.oninput=()=>{S.q=qi.value;const pos=qi.selectionStart;vUsers();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}}

function vRem(){head('Reminders','Plans ending in the next 10 days, and ones that have just ended.');
 const soon=expSoon(),gone=S.users.filter(u=>u.plan_id&&!u.active&&!u.locked&&daysTo(u.expires_at)>-30).sort((a,b)=>new Date(b.expires_at)-new Date(a.expires_at));
 const rows=(L,e)=>L.length?`<div class="list">${L.map(u=>`<div class="li"><span><b>${esc(u.name||u.email)}</b><small>${esc(u.email)} · ${esc(PLAN(u.plan_id))}${u.source==='free'?' (free)':''} · ${u.pending_payment?'renewal payment waiting':'no renewal yet'}</small></span><span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><span class="pill ${u.active?(daysTo(u.expires_at)<=3?'p-bad':'p-wait'):'p-bad'}">${u.active?daysTo(u.expires_at)+' d · ':'Ended '}${dt(u.expires_at)}</span><button class="btn o sm" data-mng="${esc(u.user_id)}">Manage</button></span></div>`).join('')}</div>`:`<p class="empty">${e}</p>`;
 $('#view').innerHTML=`<div class="card"><h2>Ending in 10 days or less</h2><p class="sub">The customer gets a push and an in-app reminder ${esc(S.settings.remind_user_days??3)} days before. You get a push ${esc(S.settings.remind_admin_days??10)} days before.</p>${rows(soon,'No plans end in the next 10 days.')}</div>
 <div class="card"><h2>Ended in the last 30 days</h2><p class="sub">The app is locked for these customers until a renewal payment is confirmed.</p>${rows(gone,'No plans ended recently.')}</div>`}

function vSet(){head('Settings','What customers see on the website. Changes apply straight away.');
 const v=k=>S.settings[k]??'';
 $('#view').innerHTML=`<div class="g2"><div class="card"><h2>Payments</h2><p class="sub">Shown at checkout and in customer messages.</p>
  <div class="fld"><label for="s-payee">Payee name (as your UPI app shows it)</label><input class="in" id="s-payee" value="${esc(v('payee_name'))}" maxlength="60"></div>
  <div class="fld"><label for="s-hours">Hours to confirm a payment</label><input class="in" id="s-hours" type="number" min="1" max="72" value="${esc(v('confirm_hours'))}"></div>
  <div class="fld"><label for="s-qr">QR image link (leave empty to use the QR built into the website)</label><input class="in" id="s-qr" value="${esc(v('qr_image_url'))}" placeholder="https://…/qr.png"></div>
  <div class="foot" style="justify-content:flex-start"><button class="btn" data-save="pay">Save payment settings</button></div></div>
 <div class="card"><h2>Reminders</h2><p class="sub">How many days before a plan ends.</p>
  <div class="fld"><label for="s-ru">Remind the customer (days)</label><input class="in" id="s-ru" type="number" min="1" max="30" value="${esc(v('remind_user_days'))}"></div>
  <div class="fld"><label for="s-ra">Remind me (days)</label><input class="in" id="s-ra" type="number" min="1" max="60" value="${esc(v('remind_admin_days'))}"></div>
  <div class="foot" style="justify-content:flex-start"><button class="btn" data-save="rem">Save reminder settings</button></div></div></div>
 <div class="card"><h2>Plans and prices</h2><p class="sub">Monthly and yearly prices the server charges.</p><div class="tw"><table class="rsp"><thead><tr><th>Plan</th><th class="num">Monthly</th><th class="num">Yearly</th></tr></thead><tbody>${S.plans.map(p=>`<tr><td data-l="Plan"><b>${esc(p.name)}</b></td><td data-l="Monthly" class="num">${inr(p.monthly_inr)}</td><td data-l="Yearly" class="num">${inr(p.yearly_inr)}</td></tr>`).join('')}</tbody></table></div><p class="note">Price changes are done together with the website text, so ask me when you want to change one.</p></div>`}

function vAct(){head('Activity','Every payment and access change, newest first. Nothing here can be edited.');
 const L={submitted:'Payment submitted',reference_corrected:'UTR corrected',approved:'Payment confirmed',rejected:'Payment rejected',free_access:'Free access given',locked:'User locked',unlocked:'User unlocked',setting_changed:'Setting changed'};
 $('#view').innerHTML=`<div class="card">${S.audit.length?`<div class="tw"><table class="rsp"><thead><tr><th>When</th><th>What</th><th>User</th><th>Details</th><th>By</th></tr></thead><tbody>${S.audit.map(a=>{const u=uById(a.user_id),ad=a.admin_id?uById(a.admin_id):null;const det=[a.payment_id?`<span class="mono">${esc(a.payment_id)}</span>`:'',a.old_utr?`UTR ${esc(a.old_utr)} → ${esc(a.new_utr)}`:a.new_utr?`UTR ${esc(a.new_utr)}`:'',a.reason?esc(a.reason):'',a.action==='setting_changed'&&a.details?esc(a.details.key+' = '+JSON.stringify(a.details.value)):'',a.action==='free_access'&&a.details?esc(PLAN(a.details.plan)+' until '+dt(a.details.until)):''].filter(Boolean).join(' · ');
  return `<tr><td data-l="When">${dtt(a.at)}</td><td data-l="What"><b>${esc(L[a.action]||a.action)}</b></td><td data-l="User">${esc(u.email||'–')}</td><td data-l="Details">${det||'–'}</td><td data-l="By">${ad?esc(ad.email):a.admin_id?'admin':'customer'}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No activity yet.</p>'}</div>`}

/* ── dialogs ── */
function dialog(html,onOpen){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;document.body.append(o);
 const close=()=>{o.remove();removeEventListener('keydown',k)},k=e=>{if(e.key==='Escape')close()};addEventListener('keydown',k);
 o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-x]'))close()});onOpen&&onOpen(o,close);const f=o.querySelector('input,textarea,button');f&&f.focus()}

const REASONS=['No payment with this UPI reference reached us.','The amount received does not match the amount due.','The UPI reference number is incomplete or incorrect.','This payment was made for a different order.'];
function review(id){const p=S.pays.find(x=>x.id===id);if(!p)return;const u=uById(p.user_id);
 dialog(`<h3>Review payment</h3><p class="sub">Open your UPI or bank app and find this payment first.</p>
  <dl class="dl"><dt>Customer</dt><dd>${esc(p.customer_name||u.name||'–')}<br><small style="color:var(--mu)">${esc(u.email||'')}${p.customer_phone?' · '+esc(p.customer_phone):''}</small></dd><dt>Request</dt><dd class="mono">${esc(p.id)}</dd><dt>Plan</dt><dd>${esc(PLAN(p.plan_id))}, ${p.billing_interval==='year'?'yearly (365 days)':'monthly (30 days)'}${p.is_renewal?' · renewal':''}</dd><dt>Amount due</dt><dd style="font-size:1.15rem"><b>${inr(p.expected_amount)}</b></dd><dt>UTR</dt><dd class="mono" style="font-size:1rem">${esc(p.utr)} <button class="cp" data-copy="${esc(p.utr)}" aria-label="Copy UTR">${svg('copy')}</button></dd><dt>Submitted</dt><dd>${dtt(p.submitted_at)}</dd></dl>
  <div id="rvA"><label class="chk"><input type="checkbox" id="c1"><span>I can see a credit of exactly <b>${inr(p.expected_amount)}</b> in my account.</span></label><label class="chk"><input type="checkbox" id="c2"><span>Its UPI reference matches <b class="mono">${esc(p.utr)}</b>.</span></label>
  <div class="foot"><button class="btn o" data-x>Cancel</button><button class="btn bad" id="toRej">Reject</button><button class="btn" id="doOk" disabled>Confirm payment</button></div></div>
  <div id="rvR" class="hide"><div class="fld"><label for="rr">Reason the customer will see</label><textarea class="in" id="rr" rows="3" maxlength="300"></textarea></div><div class="chips">${REASONS.map(r=>`<button type="button" data-r="${esc(r)}">${esc(r)}</button>`).join('')}</div>
  <div class="foot"><button class="btn o" id="back">Back</button><button class="btn bad" id="doRej">Reject payment</button></div></div>`,(o,close)=>{
  const c1=$('#c1',o),c2=$('#c2',o),ok=$('#doOk',o),upd=()=>ok.disabled=!(c1.checked&&c2.checked);c1.onchange=upd;c2.onchange=upd;
  $('#toRej',o).onclick=()=>{$('#rvA',o).classList.add('hide');$('#rvR',o).classList.remove('hide');$('#rr',o).focus()};
  $('#back',o).onclick=()=>{$('#rvR',o).classList.add('hide');$('#rvA',o).classList.remove('hide')};
  o.addEventListener('click',e=>{const r=e.target.closest('[data-r]');if(r)$('#rr',o).value=r.dataset.r});
  const act=async(dec,btn)=>{const reason=dec==='reject'?$('#rr',o).value.trim():null;if(dec==='reject'&&!reason){toast('Write a reason for the customer.',true);$('#rr',o).focus();return}
   btn.disabled=true;const t=btn.textContent;btn.textContent='Saving…';
   const {error}=await sb.rpc('billing_review_payment',{p_payment:p.id,p_decision:dec,p_reason:reason});
   if(error){btn.disabled=false;btn.textContent=t;toast(friendly(error),true);if(/already/.test(friendly(error))){close();load(true)}return}
   close();toast(dec==='approve'?'Payment confirmed. The customer has been notified.':'Payment rejected. The customer has been notified.');load(true)};
  ok.onclick=()=>act('approve',ok);$('#doRej',o).onclick=e=>act('reject',e.currentTarget)})}

function manage(uid){const u=uById(uid);if(!u.user_id)return;const s=userState(u);
 const hist=S.pays.filter(p=>p.user_id===uid),def=u.expires_at&&u.active?new Date(u.expires_at):new Date(Date.now()+30*DAY);
 const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
 dialog(`<h3>${esc(u.name||u.email)}</h3><p class="sub">${esc(u.email)} · <span class="pill ${s[0]}">${s[1]}</span></p>
  <dl class="dl"><dt>Plan</dt><dd>${u.plan_id?esc(PLAN(u.plan_id))+(u.source==='free'?' (free)':''):'None'}</dd><dt>Ends</dt><dd>${u.expires_at?dt(u.expires_at):'–'}</dd><dt>Joined</dt><dd>${dt(u.signed_up)}</dd><dt>Last sign-in</dt><dd>${ago(u.last_sign_in)}</dd><dt>Paid in total</dt><dd>${inr(u.paid_total)}</dd></dl>
  <div class="card" style="background:var(--bg2);margin:0 0 12px"><h2>Give access or change plan</h2><p class="sub">Free of charge, until the date you pick. Use it for friends, testers or to fix a mistake.</p>
   <div class="fld"><label for="mp">Plan</label><select class="in" id="mp">${S.plans.map(p=>`<option value="${esc(p.id)}" ${p.id===(u.plan_id||'pro_plus')?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
   <div class="fld"><label for="md">Access until</label><input class="in" id="md" type="date" value="${iso(def)}"></div>
   <div class="chips"><button type="button" data-add="30">+30 days</button><button type="button" data-add="90">+90 days</button><button type="button" data-add="365">+1 year</button><button type="button" data-add="end">End today</button></div>
   <div class="fld"><label for="mn">Note (only you see this)</label><input class="in" id="mn" maxlength="200" placeholder="For example: tester, free for 3 months"></div>
   <div class="foot" style="justify-content:flex-start"><button class="btn" id="mSave">Save access</button></div></div>
  ${u.plan_id?`<div class="card" style="background:var(--bg2);margin:0 0 12px"><h2>${u.locked?'Unlock this user':'Lock this user'}</h2><p class="sub">${u.locked?'They get their plan back straight away, until its end date.':'The app locks at their next check, whatever their plan says. Use it to stop access or to make them pay first.'}</p>
   ${u.locked?'':'<div class="fld"><label for="ml">Reason (only you see this)</label><input class="in" id="ml" maxlength="200"></div>'}
   <div class="foot" style="justify-content:flex-start"><button class="btn ${u.locked?'':'bad'}" id="mLock">${u.locked?'Unlock':'Lock now'}</button></div></div>`:''}
  ${hist.length?`<h2 style="font-size:1rem;margin:6px 0 8px">Payment history</h2><div class="list">${hist.map(p=>{const st=PAYST[p.status];return `<div class="li"><span><b>${inr(p.expected_amount)} · ${esc(PLAN(p.plan_id))}</b><small>${dt(p.submitted_at)} · <span class="mono">${esc(p.utr)}</span></small></span><span class="pill ${st[0]}">${st[1]}</span></div>`}).join('')}</div>`:''}
  <div class="foot"><button class="btn o" data-x>Close</button></div>`,(o,close)=>{
  const d=$('#md',o);o.addEventListener('click',e=>{const a=e.target.closest('[data-add]');if(!a)return;if(a.dataset.add==='end'){d.value=iso(new Date());return}const base=d.value?new Date(d.value+'T12:00:00'):new Date();d.value=iso(new Date(base.getTime()+(+a.dataset.add)*DAY))});
  $('#mSave',o).onclick=async e=>{const b=e.currentTarget;if(!d.value){toast('Pick a date.',true);return}
   const until=new Date(d.value+'T23:59:59+05:30').toISOString();b.disabled=true;
   const {error}=await sb.rpc('billing_set_access',{p_user:uid,p_plan:$('#mp',o).value,p_until:until,p_note:$('#mn',o).value.trim()||null});
   b.disabled=false;if(error){toast(friendly(error),true);return}close();toast('Access saved.');load(true)};
  const lk=$('#mLock',o);if(lk)lk.onclick=async()=>{lk.disabled=true;const {error}=await sb.rpc('billing_set_locked',{p_user:uid,p_locked:!u.locked,p_reason:u.locked?null:(($('#ml',o)||{}).value||'').trim()||null});
   lk.disabled=false;if(error){toast(friendly(error),true);return}close();toast(u.locked?'User unlocked.':'User locked.');load(true)}})}

async function saveSettings(kind,btn){const pairs=kind==='pay'?[['payee_name',$('#s-payee').value.trim()],['confirm_hours',+$('#s-hours').value],['qr_image_url',$('#s-qr').value.trim()]]:[['remind_user_days',+$('#s-ru').value],['remind_admin_days',+$('#s-ra').value]];
 if(kind==='pay'&&!pairs[0][1]){toast('Enter the payee name.',true);return}
 if(pairs.some(([k,v])=>typeof v==='number'&&(!Number.isInteger(v)||v<1))){toast('Use whole numbers of 1 or more.',true);return}
 const qr=kind==='pay'&&pairs[2][1];if(qr&&!/^https:\/\//.test(qr)){toast('The QR link must start with https://',true);return}
 btn.disabled=true;for(const [k,v] of pairs){if(JSON.stringify(S.settings[k])===JSON.stringify(v))continue;const {error}=await sb.rpc('billing_set_setting',{p_key:k,p_value:v});if(error){btn.disabled=false;toast(friendly(error),true);return}}
 btn.disabled=false;toast('Settings saved.');load(true)}

/* ── clicks ── */
document.addEventListener('click',e=>{const t=e.target;
 const g=t.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.f||null);return}
 const r=t.closest('[data-rev]');if(r){review(r.dataset.rev);return}
 const m=t.closest('[data-mng]');if(m){manage(m.dataset.mng);return}
 const pf=t.closest('[data-pf]');if(pf){S.payF=pf.dataset.pf;vPays();return}
 const uf=t.closest('[data-uf]');if(uf){S.userF=uf.dataset.uf;vUsers();return}
 const sv=t.closest('[data-save]');if(sv){saveSettings(sv.dataset.save,sv);return}
 const cp=t.closest('[data-copy]');if(cp){(navigator.clipboard?navigator.clipboard.writeText(cp.dataset.copy):Promise.reject()).then(()=>toast('Copied')).catch(()=>toast(cp.dataset.copy))}});

boot();
</script>
</body>
</html>
