<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>FinanceOS Command Center</title>
<meta name="theme-color" content="#04110d">
<link rel="manifest" href="admin.webmanifest">
<link rel="icon" type="image/png" href="admin-icon-192.png">
<link rel="apple-touch-icon" href="admin-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FOS Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#04110d;--bg2:#071a14;--card:#0b241d;--card2:#0e2c23;--line:#164236;--tx:#e9fff5;--mu:#8db5a5;--em:#10b981;--em2:#34d399;--ink:#022c1f;--warn:#fbbf24;--bad:#f87171;--info:#38bdf8;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2fbf7;--bg2:#e7f7f0;--card:#fff;--card2:#f4fbf8;--line:#bfe3d3;--tx:#06291e;--mu:#43695a;--ink:#fff;--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}}
:root[data-theme="light"]{--bg:#f2fbf7;--bg2:#e7f7f0;--card:#fff;--card2:#f4fbf8;--line:#bfe3d3;--tx:#06291e;--mu:#43695a;--ink:#fff;--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font:15px/1.5 "DM Sans",system-ui,sans-serif;min-height:100%}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--em2)}
.hide{display:none!important}
/* sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(800px 400px at 50% -10%,rgba(16,185,129,.22),transparent 70%),var(--bg)}
.gate .box{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
.logo{display:flex;align-items:center;gap:10px;font:800 1.25rem "Bricolage Grotesque",sans-serif}.logo i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--em2),var(--em));color:var(--ink);font-style:normal}
.logo b{color:var(--em2)}
.fld{display:grid;gap:6px;margin-top:14px}.fld label{font-size:.85rem;color:var(--mu);font-weight:500}
.in{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);outline:none}.in:focus{border-color:var(--em2);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:11px;border:1px solid transparent;background:var(--em);color:var(--ink);font-weight:700;cursor:pointer;white-space:nowrap;min-height:40px}
.btn:hover{filter:brightness(1.07)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.o{background:transparent;border-color:var(--line);color:var(--tx)}.btn.o:hover{border-color:var(--em2)}
.btn.bad{background:transparent;border-color:rgba(248,113,113,.55);color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:.85rem;border-radius:9px}
.err{color:var(--bad);font-size:.88rem;margin-top:10px;min-height:1.2em}
/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:18px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;border:0;background:none;color:var(--mu);cursor:pointer;font-weight:500}
.nav button:hover{background:var(--card);color:var(--tx)}.nav button.on{background:var(--card);color:var(--tx);box-shadow:inset 3px 0 0 var(--em2)}
.nav svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .ct{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--warn);color:#1a1200;font:700 .75rem/22px "DM Sans";text-align:center}
.side .me{margin-top:auto;font-size:.82rem;color:var(--mu);display:grid;gap:8px;word-break:break-all}
main{padding:24px clamp(16px,3vw,36px) 60px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:1.6rem}.top p{color:var(--mu);font-size:.9rem}
.top .acts{display:flex;gap:8px;align-items:center}
.stamp{font-size:.8rem;color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--em2)}
.kpi small{color:var(--mu);font-size:.82rem}.kpi b{display:block;font:800 1.9rem/1.15 "Bricolage Grotesque",sans-serif;margin-top:4px}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--bad)}.kpi.ok b{color:var(--em2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h2{font-size:1.1rem;margin-bottom:4px}.card .sub{color:var(--mu);font-size:.86rem;margin-bottom:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);flex-wrap:wrap}
.seg button{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:9px;cursor:pointer;font-weight:500;font-size:.88rem}
.seg button.on{background:var(--em);color:var(--ink)}
.bar .in{width:auto;flex:1;min-width:180px;padding:8px 12px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;color:var(--mu);font-weight:500;font-size:.8rem;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td small{display:block;color:var(--mu);font-size:.8rem}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.84rem;letter-spacing:.02em}
.num{text-align:right;white-space:nowrap}
.tw{overflow-x:auto;margin:0 -4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.76rem;font-weight:700;white-space:nowrap}
.p-wait{background:rgba(251,191,36,.16);color:var(--warn)}.p-ok{background:rgba(52,211,153,.18);color:var(--em2)}.p-bad{background:rgba(248,113,113,.16);color:var(--bad)}.p-mu{background:rgba(141,181,165,.16);color:var(--mu)}.p-info{background:rgba(56,189,248,.16);color:var(--info)}
.acts-c{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.empty{padding:26px 10px;text-align:center;color:var(--mu)}
.cp{border:0;background:none;color:var(--mu);cursor:pointer;padding:0 0 0 4px;vertical-align:middle}.cp svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.list{display:grid;gap:8px}
.li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--bg2);border:1px solid var(--line)}
.li span{min-width:0}.li small{display:block;color:var(--mu);font-size:.8rem}
/* dialogs */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.dlg h3{font-size:1.2rem;margin-bottom:6px}.dlg .sub{color:var(--mu);font-size:.88rem}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:.9rem}.dl dt{color:var(--mu)}.dl dd{margin:0;font-weight:500;word-break:break-all}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.9rem}.chk input{margin-top:3px;accent-color:var(--em)}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{border:1px solid var(--line);background:var(--bg2);border-radius:99px;padding:5px 10px;cursor:pointer;font-size:.8rem;color:var(--tx)}.chips button:hover{border-color:var(--em2)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--em2);padding:11px 16px;border-radius:12px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35);max-width:calc(100vw - 32px)}
.toast.bad{border-color:var(--bad)}
.note{font-size:.84rem;color:var(--mu);margin-top:10px}
.mtop{display:none}
@media(max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side>*{min-width:0}
 .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line);gap:10px}
 .side .logo{font-size:1.05rem}.side .logo span{display:none}
 .nav{display:flex;overflow-x:auto;gap:4px;flex:1;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
 .nav button{width:auto;white-space:nowrap;padding:8px 10px}.nav button span{display:inline}.nav button.on{box-shadow:inset 0 -2px 0 var(--em2)}
 .side .me{display:none}.mtop{display:flex}
 table.rsp,table.rsp tbody{display:block;width:100%}
 table.rsp thead{display:none}
 .bar .in{flex:1 1 100%;min-width:0}
 .tw{margin:0;overflow:visible}
 table.rsp td>span,table.rsp td>b{min-width:0;overflow-wrap:anywhere}
 table.rsp tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
 table.rsp td{display:flex;justify-content:space-between;gap:14px;border:0;padding:4px 2px;text-align:right}
 table.rsp td::before{content:attr(data-l);color:var(--mu);font-size:.8rem;text-align:left;flex:none}
 table.rsp td.num{text-align:right}
 table.rsp td .acts-c{justify-content:flex-end}
 table.rsp td small{text-align:right}
}

/* v2 additions */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
.pick label{position:relative;display:grid;gap:2px;padding:12px;border-radius:13px;border:1.5px solid var(--line);background:var(--bg2);cursor:pointer;min-height:64px}
.pick label:hover{border-color:var(--em2)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick label:has(input:checked){border-color:var(--em2);background:rgba(16,185,129,.14);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.pick label:has(input:focus-visible){outline:2px solid var(--em2);outline-offset:2px}
.pick b{font-size:.98rem}.pick small{color:var(--mu);font-size:.8rem}
.pick label.on{border-color:var(--em2);background:rgba(16,185,129,.14)}
.step{display:flex;align-items:center;gap:8px;font:700 .92rem "DM Sans";margin-top:16px}
.step i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--em);color:var(--ink);font:700 .75rem "DM Sans";font-style:normal;flex:none}
.sum{margin-top:16px;padding:12px 14px;border-radius:12px;background:rgba(16,185,129,.1);border:1px dashed var(--em2);font-size:.9rem}
.sum b{color:var(--em2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.bulk{position:sticky;bottom:12px;z-index:15;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between;padding:10px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--em2);box-shadow:0 10px 30px rgba(0,0,0,.3);margin-top:12px}
.cb{width:18px;height:18px;accent-color:var(--em);cursor:pointer}
td.c0,th.c0{width:34px;padding-right:0}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.qa button{display:grid;gap:2px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;color:var(--tx)}
.qa button:hover{border-color:var(--em2)}.qa b{font-size:.95rem}.qa small{color:var(--mu);font-size:.8rem}
.meter{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--em)}
details.help{margin-top:4px}details.help summary{cursor:pointer;color:var(--em2);font-weight:600;font-size:.9rem}
details.help ol{margin:10px 0 0 18px;display:grid;gap:6px;font-size:.9rem;color:var(--mu)}
details.help ol b{color:var(--tx)}
.tog{display:flex;gap:10px;align-items:center;font-size:.9rem;margin-top:10px;cursor:pointer}.tog input{width:18px;height:18px;accent-color:var(--em)}
.danger{border-color:rgba(248,113,113,.45)!important}
.inst{background:linear-gradient(135deg,var(--em2),var(--em));color:var(--ink);border:0}
.plan-ed .in{max-width:100%}
textarea.in{resize:vertical;min-height:70px}
.kpi small,.li small{overflow-wrap:anywhere}
@media(max-width:860px){.side .inst{display:none}.mtop.inst{display:flex}}

/* v3: green and white. Neutral surfaces, white text and cards, green only for accents. */
:root{--bg:#0c100f;--bg2:#121817;--card:#171e1c;--card2:#1d2624;--line:#2a3532;--tx:#f7fbf9;--mu:#a7b6b0;--em:#10b981;--em2:#34d399;--emd:#059669;--ink:#ffffff;--wh:#ffffff;--glow:rgba(16,185,129,.14);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f5f7f6;--bg2:#ffffff;--card:#ffffff;--card2:#f6f9f8;--line:#e2e8e5;--tx:#0f1d18;--mu:#5c6c66;--em:#059669;--em2:#047857;--emd:#047857;--ink:#ffffff;--wh:#ffffff;--glow:rgba(5,150,105,.09);--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}}
:root[data-theme="light"]{--bg:#f5f7f6;--bg2:#ffffff;--card:#ffffff;--card2:#f6f9f8;--line:#e2e8e5;--tx:#0f1d18;--mu:#5c6c66;--em:#059669;--em2:#047857;--emd:#047857;--ink:#ffffff;--wh:#ffffff;--glow:rgba(5,150,105,.09);--warn:#b45309;--bad:#dc2626;--info:#0369a1;color-scheme:light}
/* buttons: solid green with white text */
.btn{background:var(--emd);color:#fff}
.btn.o{background:var(--card);color:var(--tx)}
.seg button.on{background:var(--emd);color:#fff}
.logo i,.step i,.inst{background:var(--emd);color:#fff}
/* sidebar: white active item in dark mode, green tint in light mode */
.side{background:var(--bg2)}
.nav button.on{background:var(--wh);color:#0c100f;box-shadow:inset 3px 0 0 var(--em);font-weight:700}
.nav button.on svg{color:var(--emd)}
:root[data-theme="light"] .nav button.on{background:var(--glow);color:var(--em2)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]) .nav button.on{background:var(--glow);color:var(--em2)}}
/* cards: clean, with a thin green top accent on the numbers */
.card,.kpi{box-shadow:0 1px 2px rgba(0,0,0,.06)}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--em),transparent 80%);opacity:.9}
.kpi b{color:var(--tx)}
.kpi.ok b{color:var(--em2)}
.li,.qa button,.pick label,.chips button{background:var(--card2)}
.meter{background:var(--card2);border:1px solid var(--line)}
.p-ok{background:var(--glow);color:var(--em2);box-shadow:inset 0 0 0 1px rgba(16,185,129,.35)}
.gate{background:radial-gradient(800px 400px at 50% -10%,var(--glow),transparent 70%),var(--bg)}
.gate .box{box-shadow:0 20px 60px rgba(0,0,0,.18)}
.toast{background:var(--card);border-color:var(--em)}
.sum{background:var(--glow)}
.lnk{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--tx);cursor:pointer;text-align:left}
.lnk:hover{color:var(--em2);text-decoration:underline}
/* Sales IQ */
.sq-top{justify-content:space-between}
.sq-k em{display:block;font-style:normal;font-size:.8rem;color:var(--mu);margin-top:4px}
.sq-k .up{color:var(--em2);font-weight:700}.sq-k .dn{color:var(--bad);font-weight:700}
.kpi.sq-k{cursor:default}
.sq-chart{position:relative;margin-top:6px}
.sq-chart svg{display:block;width:100%;height:auto;overflow:visible}
.kpis.sq-kp{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.sq-grid{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.sq-base{stroke:var(--mu);stroke-width:1;opacity:.6;vector-effect:non-scaling-stroke}
.sq-ax{fill:var(--mu);font-size:11px;font-family:"DM Sans",system-ui,sans-serif}
.sq-bar{fill:var(--em)}
.sq-b{cursor:pointer;outline:none}
.sq-b:hover .sq-bar,.sq-b:focus .sq-bar,.sq-b.on .sq-bar{fill:var(--em2)}
.sq-b:focus-visible rect{stroke:var(--em2);stroke-width:1}
.sq-tip{position:absolute;top:4px;left:0;padding:6px 10px;border-radius:9px;background:var(--wh);color:#0c100f;font-size:.82rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap;border:1px solid var(--line)}
.sq-pl{margin:12px 0}.sq-pl>div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.9rem}.sq-pl span{color:var(--mu)}
.sq-pl i,.sq-mix i{display:block;height:8px;border-radius:99px;margin-top:6px;background:linear-gradient(90deg,var(--em) var(--w),var(--card2) var(--w));border:1px solid var(--line)}
.sq-mix{margin:10px 0;font-size:.9rem}.sq-mix{display:grid;grid-template-columns:1fr auto;gap:0 10px}.sq-mix i{grid-column:1/-1}.sq-mix span{color:var(--mu)}
@media(max-width:860px){.sq-top .btn{width:100%}}
/* v4: the real FinOS logo */
.logo .lg{width:36px;height:36px;flex:none;display:block;border-radius:10px;box-shadow:0 4px 14px rgba(16,185,129,.28)}
.logo .lg svg{width:100%;height:100%;display:block}
@media(max-width:860px){.logo .lg{width:32px;height:32px}}
/* v4: a little more room */
@media(min-width:861px){.side{gap:26px;padding-top:24px}.nav{gap:6px}.nav button{padding:11px 12px}}
.top{margin-bottom:28px}
.card h2+.sub{margin-top:4px}
/* v4: Settings */
.set-idx{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.set-idx a{padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--tx);text-decoration:none;font-size:.85rem;font-weight:600}
.set-idx a:hover{border-color:var(--em);color:var(--em2)}
.set-sec{scroll-margin-top:16px;transition:box-shadow .3s}
.set-sec.flash{box-shadow:0 0 0 2px var(--em)}
.set-dl{display:flex;flex-wrap:wrap;gap:8px}
select.in{appearance:auto}
/* v4: delete user */
.dr-chips button.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.dl-log summary{cursor:pointer;list-style:none}.dl-log summary::-webkit-details-marker{display:none}
.dl-log summary::before{content:'▸';display:inline-block;margin-right:8px;color:var(--mu);transition:transform .2s}.dl-log[open] summary::before{transform:rotate(90deg)}
/* v4: Sales IQ, deeper */
.card .up{color:var(--em2);font-weight:700}.card .dn{color:var(--bad);font-weight:700}
.sq-big{display:flex;flex-direction:column;gap:2px;margin:6px 0 4px}.sq-big>b{font:800 1.7rem "Bricolage Grotesque",sans-serif}.sq-big span{color:var(--mu);font-size:.88rem}.sq-big span b{color:var(--tx)}
.sq-goal{position:relative;height:12px;border-radius:99px;background:var(--card2);border:1px solid var(--line);margin-top:12px;overflow:visible}
.sq-goal i{position:absolute;left:0;top:0;bottom:0;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--emd),var(--em2))}
.sq-goal em{position:absolute;top:-4px;bottom:-4px;left:var(--p);width:2px;background:var(--tx);opacity:.6;border-radius:2px}
.sq-coh{min-width:560px}.sq-coh td,.sq-coh th{padding:8px 6px}

function dialog(html,onOpen){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">${html}</div>`;document.body.append(o);
 const prev=document.activeElement,close=()=>{o.remove();removeEventListener('keydown',k);prev&&prev.focus&&prev.focus()},k=e=>{if(e.key==='Escape')close()};addEventListener('keydown',k);
 o.addEventListener('click',e=>{if(e.target===o||e.target.closest('[data-x]'))close()});onOpen&&onOpen(o,close);const f=o.querySelector('input:not([type=radio]):not([type=checkbox]),textarea,button');f&&f.focus();return close}

/* give access: one person or many */
const DUR=[['30','1 month'],['90','3 months'],['180','6 months'],['365','1 year'],['date','Pick a date']];
function grant(uids){uids=uids.filter(i=>uById(i).user_id);if(!uids.length){toast('Pick at least one person first.',true);return}
 const one=uids.length===1?uById(uids[0]):null,cur=one&&one.plan_id?one.plan_id:(S.plans[S.plans.length-1]||{}).id;
 const extendFrom=one&&one.active?new Date(one.expires_at):null;
 dialog(`<h3>${one?(one.plan_id?'Change plan':'Give access')+': '+esc(one.name||one.email):'Give access to '+uids.length+' people'}</h3>
  <p class="sub">${one?esc(one.email):uids.slice(0,4).map(i=>esc(uById(i).email)).join(', ')+(uids.length>4?' and '+(uids.length-4)+' more':'')}</p>
  <div class="step"><i>1</i>Choose the plan</div>
  <div class="pick" role="radiogroup" aria-label="Plan">${S.plans.map(p=>`<label><input type="radio" name="gp" value="${esc(p.id)}" ${p.id===cur?'checked':''}><b>${esc(p.name)}</b><small>${inr(p.monthly_inr)} a month</small><small>${inr(p.yearly_inr)} a year</small></label>`).join('')}</div>
  <div class="step"><i>2</i>Free or paid?</div>
  <div class="pick" role="radiogroup" aria-label="Access type"><label><input type="radio" name="gk" value="free" checked><b>Free</b><small>Friends, testers, a gift. No money.</small></label><label><input type="radio" name="gk" value="paid"><b>Paid outside the website</b><small>Cash, bank transfer or another UPI. Counts in revenue.</small></label></div>
  <div class="fld hide" id="gAmtW"><label for="gAmt">Amount received from ${one?'them':'each person'} (₹)</label><input class="in" id="gAmt" type="number" min="1" inputmode="numeric"></div>
  <div class="step"><i>3</i>For how long?</div>
  <div class="pick" role="radiogroup" aria-label="How long">${DUR.map((d,i)=>`<label><input type="radio" name="gd" value="${d[0]}" ${i===0?'checked':''}><b>${d[1]}</b>${d[0]!=='date'?`<small>${d[0]} days</small>`:'<small>Any end date</small>'}</label>`).join('')}</div>
  <div class="fld hide" id="gDateW"><label for="gDate">Access until</label><input class="in" id="gDate" type="date" value="${isoD(new Date(Date.now()+30*DAY))}"></div>
  ${extendFrom?`<label class="tog"><input type="checkbox" id="gExt" checked> Add the time after their current end date (${dt(extendFrom)})</label>`:''}
  <div class="fld"><label for="gNote">Reason (optional, only you see it)</label><input class="in" id="gNote" maxlength="200" placeholder="For example: paid cash on 26 Nov"></div>
  <div class="sum" id="gSum" aria-live="polite"></div>
  <div class="foot"><button class="btn o" data-x>Cancel</button><button class="btn" id="gGo">Give access</button></div>`,(o,close)=>{
  const val=n=>($(`input[name="${n}"]:checked`,o)||{}).value;
  const until=()=>{const d=val('gd');if(d==='date'){const v=$('#gDate',o).value;return v?new Date(v+'T23:59:59+05:30'):null}
   const base=extendFrom&&$('#gExt',o)&&$('#gExt',o).checked?extendFrom.getTime():Date.now();return new Date(base+(+d)*DAY)};
  const suggest=()=>{const p=S.plans.find(x=>x.id===val('gp'))||{},d=val('gd');const days=d==='date'?Math.max(1,daysTo(until()||new Date())):+d;return days>=365?Math.round(p.yearly_inr*days/365):Math.round(p.monthly_inr*Math.max(1,Math.round(days/30)))};
  let amtTouched=false;$('#gAmt',o).oninput=()=>amtTouched=true;
  const upd=()=>{const paid=val('gk')==='paid';$('#gAmtW',o).classList.toggle('hide',!paid);$('#gDateW',o).classList.toggle('hide',val('gd')!=='date');
   if(paid&&!amtTouched)$('#gAmt',o).value=suggest();
   $$('.pick label',o).forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));
   const u=until();$('#gSum',o).innerHTML=u?`<b>${esc(PLAN(val('gp')))}</b>, ${paid?'paid'+($('#gAmt',o).value?' '+inr($('#gAmt',o).value):''):'free'}, until <b>${dt(u)}</b> for ${one?esc(one.name||one.email):uids.length+' people'}. ${one&&one.plan_id?'This replaces their current plan.':''} They can use the app straight away.`:'Pick an end date.'};
  o.addEventListener('change',upd);o.addEventListener('input',e=>{if(e.target.id==='gDate')upd()});upd();
  $('#gGo',o).onclick=async e=>{const b=e.currentTarget,u=until(),paid=val('gk')==='paid',amt=paid?Math.round(+$('#gAmt',o).value):null;
   if(!u||u<=new Date()){toast('Pick an end date after today.',true);return}if(paid&&!(amt>0)){toast('Enter the amount you received.',true);return}
   b.disabled=true;b.textContent='Saving…';
   const {data,error}=await sb.rpc('billing_grant',{p_users:uids,p_plan:val('gp'),p_until:u.toISOString(),p_kind:paid?'paid':'free',p_note:$('#gNote',o).value.trim()||null,p_amount:amt});
   b.disabled=false;b.textContent='Give access';if(error){toast(friendly(error),true);return}
   close();S.sel.clear();toast(`Done. ${PLAN(val('gp'))} given to ${data??uids.length} ${(data??uids.length)===1?'person':'people'} until ${dt(u)}.`);load(true)}})}

function pickUser(){dialog(`<h3>Give someone access</h3><p class="sub">Search by name or email.</p><input class="in" id="pu" placeholder="Name or email" aria-label="Find a user" style="margin-top:12px"><div class="list" id="pul" style="margin-top:10px;max-height:50vh;overflow:auto"></div><div class="foot"><button class="btn o" data-x>Cancel</button></div>`,(o,close)=>{
 const draw=()=>{const q=$('#pu',o).value.toLowerCase();$('#pul',o).innerHTML=S.users.filter(u=>!q||[u.email,u.name].join(' ').toLowerCase().includes(q)).slice(0,30).map(u=>{const s=userState(u);return `<button class="li" style="cursor:pointer;text-align:left;color:var(--tx);width:100%" data-pu="${esc(u.user_id)}"><span><b>${esc(u.name||u.email)}</b><small>${esc(u.email)}</small></span><span class="pill ${s[0]}">${s[1]}</span></button>`}).join('')||'<p class="empty">Nobody found.</p>'};

/* block or unblock many people */
async function bulkBlock(ids,on){ids=ids.filter(i=>{const u=uById(i);return u.user_id&&!u.is_admin&&!!u.locked!==on});let n=0,err=null;
 for(const id of ids){const {error}=await sb.rpc('billing_set_blocked',{p_user:id,p_blocked:on,p_reason:on?'Blocked from the Users list':null});if(error){err=error;break}n++}
 if(err)toast(friendly(err).replace('SQL file 5','SQL file 6').replace('05-admin-extras.sql','06-block-users.sql'),true);else toast((on?'Blocked ':'Unblocked ')+n+' '+(n===1?'person':'people')+'.');S.sel.clear();load(true)}

/* saving */
async function savePlan(id,btn){const m=Math.round(+$('#pm-'+id).value),y=Math.round(+$('#py-'+id).value),a=$('#pa-'+id).checked;
 if(!(m>=1&&y>=1)){toast('Prices must be 1 rupee or more.',true);return}
 if(y<m){toast('The yearly price is lower than the monthly price. Check the numbers.',true);return}
 btn.disabled=true;const {error}=await sb.rpc('billing_set_plan',{p_plan:id,p_monthly:m,p_yearly:y,p_active:a});btn.disabled=false;
 if(error){toast(friendly(error),true);return}toast(PLAN(id)+' saved. The website now shows '+inr(m)+' a month and '+inr(y)+' a year.');load(true)}
async function saveCode(btn){const code=$('#cc').value.trim().toUpperCase(),pct=Math.round(+$('#cpct').value),mx=$('#cmax').value?Math.round(+$('#cmax').value):null;
 if(!/^[A-Z0-9]{3,20}$/.test(code)){toast('Codes use 3 to 20 letters or numbers, no spaces.',true);return}
 if(!(pct>=1&&pct<=90)){toast('The discount must be between 1 and 90 percent.',true);return}
 btn.disabled=true;const {error}=await sb.rpc('billing_save_coupon',{p_code:code,p_pct:pct,p_first_only:$('#cfirst').checked,p_max_uses:mx,p_active:$('#cact').checked,p_show:$('#cshow').checked,p_label:$('#clabel').value.trim()||null});btn.disabled=false;
 if(error){toast(friendly(error),true);return}toast('Code '+code+' saved.');load(true)}
async function togCode(code){const c=S.coupons.find(x=>x.code===code);if(!c)return;
 const {error}=await sb.rpc('billing_save_coupon',{p_code:c.code,p_pct:c.pct,p_first_only:c.first_order_only,p_max_uses:c.max_uses,p_active:!c.active,p_show:!!c.show_on_site,p_label:c.label||null});
 if(error){toast(friendly(error),true);return}toast(c.code+(c.active?' switched off.':' switched on.'));load(true)}
function editCode(code){const c=S.coupons.find(x=>x.code===code);if(!c)return;$('#cc').value=c.code;$('#cpct').value=c.pct;$('#cmax').value=c.max_uses??'';$('#cfirst').checked=!!c.first_order_only;$('#cact').checked=!!c.active;$('#cshow').checked=!!c.show_on_site;$('#clabel').value=c.label||'';$('#cc').scrollIntoView({behavior:'smooth',block:'center'});$('#cc').focus()}

async function saveSettings(kind,btn){if(['msg','cc','dr'].includes(kind))return saveMore(kind,btn);const pairs=kind==='pay'?[['payee_name',$('#s-payee').value.trim()],['confirm_hours',+$('#s-hours').value],['qr_image_url',$('#s-qr').value.trim()]]:kind==='ref'?[['referral_pct',+$('#s-rp').value],['referral_reward',+$('#s-rr').value],['referral_max_open',+$('#s-rm').value]]:[['remind_user_days',+$('#s-ru').value],['remind_admin_days',+$('#s-ra').value]];
 if(kind==='ref'&&(pairs[0][1]>90)){toast('The discount must be 90% or less.',true);return}

const SQP=[['30','30 days'],['90','90 days'],['365','12 months'],['all','All time']];
const sqBase=p=>{const pl=S.plans.find(x=>x.id===p.plan_id);if(!pl)return p.expected_amount||0;return p.billing_interval==='year'?pl.yearly_inr:pl.monthly_inr};
const sqMonths=p=>p.billing_interval==='year'?12:1;
const sqPct=(a,b)=>b?Math.round(a/b*100):0;
const pk=p=>p.user_id||'del:'+(p.customer_email||p.customer_name||p.id);
const mIdx=t=>{const d=new Date(t);return d.getFullYear()*12+d.getMonth()};
function sqCalc(P){
 const now=Date.now(),span=P==='all'?0:+P*DAY,from=P==='all'?0:now-span,pFrom=now-2*span;
 const ver=S.pays.filter(p=>p.status==='verified').map(p=>({...p,t:Date.parse(p.verified_at||p.submitted_at)||0})).sort((a,b)=>a.t-b.t);
 const first={};ver.forEach(p=>{if(!first[pk(p)])first[pk(p)]=p.id});
 const cur=ver.filter(p=>p.t>=from),prev=P==='all'?[]:ver.filter(p=>p.t>=pFrom&&p.t<from);
 const sum=a=>a.reduce((n,p)=>n+(p.expected_amount||0),0);
 const isNew=p=>first[pk(p)]===p.id;
 const lastBy={};ver.forEach(p=>{lastBy[pk(p)]=p});
 const people=S.users.filter(u=>!u.is_admin);
 const paying=people.filter(u=>u.active&&u.source==='payment');
 const mrr=Math.round(paying.reduce((n,u)=>{const l=lastBy[u.user_id];return l?n+(l.billing_interval==='year'?l.expected_amount/12:l.expected_amount):n},0));
 const renewedU=new Set(cur.filter(p=>!isNew(p)).map(pk));
 const churned=people.filter(u=>u.source==='payment'&&!u.active&&u.expires_at&&Date.parse(u.expires_at)>=from&&Date.parse(u.expires_at)<=now&&!renewedU.has(u.user_id));
 const disc=cur.filter(p=>p.coupon_code||p.referral_code).map(p=>({...p,off:Math.max(0,sqBase(p)-(p.expected_amount||0))}));
 return{now,from,ver,cur,prev,rev:sum(cur),prevRev:sum(prev),newRev:sum(cur.filter(isNew)),newCust:cur.filter(isNew).length,
  renewals:cur.filter(p=>!isNew(p)).length,payers:new Set(cur.map(pk)).size,paying,mrr,renewedU,churned,disc,isNew,sum,lastBy,people};
}
function sqBuckets(c,P){
 const now=new Date(c.now),B=[];
 if(P==='30'){for(let i=29;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);B.push({s:d.getTime(),e:d.getTime()+DAY,l:d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}),k:i%5===0||i===0})}}
 else if(P==='90'){for(let i=12;i>=0;i--){const e=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1-i*7).getTime();B.push({s:e-7*DAY,e,l:'Week of '+new Date(e-7*DAY).toLocaleDateString('en-IN',{day:'numeric',month:'short'}),k:i%3===0})}}
 else{let n=12;if(P==='all'&&c.ver.length){const f=new Date(c.ver[0].t);n=Math.min(36,Math.max(6,(now.getFullYear()-f.getFullYear())*12+now.getMonth()-f.getMonth()+1))}
  for(let i=n-1;i>=0;i--){const s=new Date(now.getFullYear(),now.getMonth()-i,1);B.push({s:s.getTime(),e:new Date(s.getFullYear(),s.getMonth()+1,1).getTime(),l:s.toLocaleDateString('en-IN',{month:'short',year:'numeric'}),k:n<=12||i%3===0})}}
 B.forEach(b=>{const ps=c.ver.filter(p=>p.t>=b.s&&p.t<b.e);b.v=c.sum(ps);b.n=ps.length});return B;
}
function sqChart(B){
 const W=Math.max(300,Math.round((($('#view')||{}).clientWidth||680)-40)),H=230,L=46,R=8,T=12,Bt=28,mx=Math.max(1,...B.map(b=>b.v)),step=Math.pow(10,Math.floor(Math.log10(mx))),top=Math.ceil(mx/step)*step||1;
 const bw=(W-L-R)/B.length,gap=Math.min(6,bw*.3),y=v=>T+(H-T-Bt)*(1-v/top);
 const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(top*f)}" y2="${y(top*f)}" class="sq-grid"/><text x="${L-6}" y="${y(top*f)+4}" text-anchor="end" class="sq-ax">${f?'₹'+Math.round(top*f).toLocaleString('en-IN'):'0'}</text>`).join('');
 const bars=B.map((b,i)=>{const x=L+i*bw+gap/2,w=Math.max(2,bw-gap),h=Math.max(0,y(0)-y(b.v)),r=Math.min(4,w/2,h);

 const a=t.closest('[data-act]');if(a){const k=a.dataset.act;
  if(k==='selall'){const rows=userRows(),on=rows.length&&rows.every(u=>S.sel.has(u.user_id));rows.forEach(u=>on?S.sel.delete(u.user_id):S.sel.add(u.user_id));vUsers()}
  else if(k==='selnone'){S.sel.clear();vUsers()}
  else if(k==='sq-csv')csvSales();
  else if(k==='dl-dels')csvDels();
  else if(k==='backup')backup();
  else if(k==='adm-add')admAdd(a);
  else if(k==='adm-rm')admRm(a);
  else if(k==='grant-sel')grant([...S.sel]);
  else if(k==='block-sel'||k==='unblock-sel'){const on=k==='block-sel';if(!a.dataset.sure){a.dataset.sure=1;a.textContent='Tap again to '+(on?'block ':'unblock ')+S.sel.size;return}bulkBlock([...S.sel],on)}
  else if(k==='grant-pick')pickUser();
  else if(k==='csv')csvUsers();
  else if(k==='csvp')csvPays();
  else if(k==='savecode')saveCode(a);
  else if(k==='install')install();
  return}
 const cp=t.closest('[data-copy]');if(cp){(navigator.clipboard?navigator.clipboard.writeText(cp.dataset.copy):Promise.reject()).then(()=>toast('Copied')).catch(()=>toast(cp.dataset.copy))}});

/* v5: phone and tablet menu */
(function(){
 const side=document.querySelector('.side'),nav=document.getElementById('nav'),me=side&&side.querySelector('.me');if(!side||!nav)return;
 const drw=document.createElement('div');drw.className='drw';drw.id='drw';drw.setAttribute('aria-label','Menu');
 drw.innerHTML='<div class="drw-h"><span>Menu</span><button type="button" id="drwX" aria-label="Close menu">&times;</button></div>';
 nav.parentNode.insertBefore(drw,nav);drw.appendChild(nav);if(me)drw.appendChild(me);
 const b=document.createElement('button');b.type='button';b.className='mnu';b.id='mnu';b.setAttribute('aria-controls','drw');b.setAttribute('aria-expanded','false');
 b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span><span class="bdg" id="mnuB"></span>';
 side.appendChild(b);
 const bg=document.createElement('div');bg.className='drb';bg.id='drb';side.insertBefore(bg,drw);   /* inside the top bar, so it sits under the menu */
 const set=o=>{document.body.classList.toggle('drw-on',o);b.setAttribute('aria-expanded',String(o));if(o){const a=nav.querySelector('.on')||nav.querySelector('button');a&&a.focus({preventScroll:true})}};
 b.addEventListener('click',()=>set(!document.body.classList.contains('drw-on')));
 bg.addEventListener('click',()=>set(false));drw.querySelector('#drwX').addEventListener('click',()=>set(false));
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('drw-on'))set(false)});
 nav.addEventListener('click',e=>{if(e.target.closest('[data-tab]')){set(false);requestAnimationFrame(()=>scrollTo({top:0}))}});
 drw.addEventListener('click',e=>{if(e.target.closest('#out,#inst1'))set(false)});
 /* the badge on the Menu button = payments waiting, copied from the Payments item */
 const sync=()=>{const p=nav.querySelector('[data-tab="payments"] .ct');const v=p?p.textContent.trim():'';const B=document.getElementById('mnuB');if(B&&B.textContent!==v)B.textContent=/^\d+$/.test(v)&&v!=='0'?v:''};
 new MutationObserver(sync).observe(nav,{childList:true,subtree:true,characterData:true});sync();
 matchMedia('(min-width:861px)').addEventListener('change',e=>{if(e.matches)set(false)});
})();
boot();
</script>
